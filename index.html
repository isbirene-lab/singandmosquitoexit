<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>흥얼흥얼, 창밖으로!</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#110d18;color:#ffe9f8;font:14px system-ui,sans-serif}body{min-height:100vh;display:grid;place-items:center;padding:12px}main{width:min(100%,1000px)}canvas{width:100%;height:auto;display:block;aspect-ratio:900/620;border:2px solid #9a5e91;border-radius:16px;box-shadow:0 0 38px #d35eaf33;touch-action:none;outline:none}</style></head><body><main><canvas id="game" width="900" height="620" tabindex="0" aria-label="흥얼흥얼 창밖으로 게임"></canvas></main><script>
(()=>{
const c=document.querySelector('#game'),g=c.getContext('2d'),W=900,H=620,beat=880,win={x:450,y:45,w:230,h:100},sleepGoal=12000,studyGoal=10000;
const playerSprite=new Image();playerSprite.src='./baeksoobucheo.png';
const mosquitoFrames=[new Image(),new Image()];mosquitoFrames[0].src='./mosquito1.png';mosquitoFrames[1].src='./mosquito2.png';
let scene='title',level=1,player,bugs,notes,keys={},lives,escaped,opening,sleep,study,streak,beatStart,last,hitAt=-1e9,missAt=-1e9,ended=false,success=false,buzzMedia=null;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function bug(x,y){let a=Math.random()*Math.PI*2;return{x,y,vx:Math.cos(a),vy:Math.sin(a),speed:110+Math.random()*26,turn:Math.random()*1.8,phase:Math.random()*8,alive:true}}
function ensureBuzz(){if(!buzzMedia){buzzMedia=new Audio('./mosquito-buzz.mp3');buzzMedia.loop=true;buzzMedia.volume=0;const p=buzzMedia.play();if(p)p.catch(()=>{})}}
function initGame(){player={x:450,y:475};bugs=[bug(155,245),bug(725,290),bug(300,390)];notes=[];keys={};lives=3;escaped=0;opening=0;sleep=0;study=0;streak=0;ended=false;success=false;beatStart=performance.now()+850;last=performance.now();scene='game';}
function start(){level=1;scene='intro';introUntil=performance.now()+1250;}
function hum(){let now=performance.now(),p=((now-beatStart)%beat+beat)%beat,d=Math.min(p,beat-p);if(d<145){opening=Math.min(1,opening+1/24);streak++;hitAt=now;notes.push({x:player.x,y:player.y,t:now});}else{streak=0;missAt=now}try{let a=new(window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator(),v=a.createGain();o.type='sine';o.frequency.value=d<145?330:220;v.gain.setValueAtTime(.0001,a.currentTime);v.gain.exponentialRampToValueAtTime(.025,a.currentTime+.03);v.gain.exponentialRampToValueAtTime(.0001,a.currentTime+.2);o.connect(v).connect(a.destination);o.start();o.stop(a.currentTime+.21)}catch{}}
function nearBed(){return Math.hypot(player.x-770,player.y-465)<92}function nearDesk(){return Math.hypot(player.x-770,player.y-155)<90}
function updateBuzz(){if(!buzzMedia||!player)return;let d=Infinity;for(const m of bugs||[])if(m.alive)d=Math.min(d,Math.hypot(m.x-player.x,m.y-player.y));let target=scene==='game'&&!ended?Math.pow(Math.max(0,1-d/360),2)*.8:0;buzzMedia.volume=clamp(buzzMedia.volume+(target-buzzMedia.volume)*.12,0,1)}
function update(now){let dt=Math.min(.04,(now-last)/1000||0);last=now;if(scene==='intro'&&now>introUntil)initGame();if(scene==='game'&&!ended){let dx=(keys.ArrowRight?1:0)-(keys.ArrowLeft?1:0),dy=(keys.ArrowDown?1:0)-(keys.ArrowUp?1:0),d=Math.hypot(dx,dy)||1;player.x=clamp(player.x+dx/d*205*dt,48,852);player.y=clamp(player.y+dy/d*205*dt,150,570);notes=notes.filter(n=>now-n.t<2000);if(level>=2&&nearBed())sleep=Math.min(sleepGoal,sleep+dt*1000);if(level>=3&&nearDesk())study=Math.min(studyGoal,study+dt*1000);
for(const m of bugs){if(!m.alive)continue;m.phase+=dt*10;m.turn-=dt;if(m.turn<=0){let a=Math.random()*Math.PI*2;m.vx=m.vx*.78+Math.cos(a)*.22;m.vy=m.vy*.78+Math.sin(a)*.22;m.turn=.5+Math.random()*1.8}if(notes.length){let n=notes.reduce((a,b)=>Math.hypot(a.x-m.x,a.y-m.y)<Math.hypot(b.x-m.x,b.y-m.y)?a:b),dx=n.x-m.x,dy=n.y-m.y,d=Math.hypot(dx,dy)||1;m.vx+=dx/d*.055;m.vy+=dy/d*.055}if(opening>=1){let dx=win.x-m.x,dy=win.y+40-m.y,d=Math.hypot(dx,dy)||1;m.vx+=dx/d*.035;m.vy+=dy/d*.035}let d=Math.hypot(m.vx,m.vy)||1;m.vx/=d;m.vy/=d;let sp=m.speed*(1+Math.max(0,1-(now-hitAt)/2500)*.45);m.x+=m.vx*sp*dt;m.y+=m.vy*sp*dt;if(m.x<25||m.x>875)m.vx*=-1;if(m.y<115||m.y>595)m.vy*=-1;m.x=clamp(m.x,25,875);m.y=clamp(m.y,115,595);
if(opening>=1&&Math.abs(m.x-win.x)<win.w*.55&&m.y<win.y+130){m.alive=false;escaped++}else if(Math.hypot(m.x-player.x,m.y-player.y)<32){lives--;missAt=now;m.x=clamp(player.x+(Math.random()-.5)*200,40,860);m.y=clamp(player.y+100,150,580);if(lives<=0){ended=true;success=false}}}
let taskDone=level===1||(sleep>=sleepGoal&&(level===2||study>=studyGoal));if(escaped===3&&taskDone){ended=true;success=true}}
updateBuzz();render(now);requestAnimationFrame(update)}
function txt(s,x,y,size=24,color='#ffe8f7',weight='700'){g.fillStyle=color;g.font=`${weight} ${size}px system-ui`;g.textAlign='center';g.textBaseline='middle';g.fillText(s,x,y)}
function panel(x,y,w,h){g.fillStyle='rgba(18,10,24,.88)';g.strokeStyle='rgba(246,188,225,.7)';g.lineWidth=2;g.beginPath();g.roundRect(x,y,w,h,20);g.fill();g.stroke()}
function room(){let bg=g.createRadialGradient(450,330,20,450,330,610);bg.addColorStop(0,'#30202e');bg.addColorStop(1,'#080811');g.fillStyle=bg;g.fillRect(0,0,W,H);g.strokeStyle='#392b3b';g.lineWidth=5;g.strokeRect(18,18,864,584);
// window
let x=win.x-win.w/2,y=win.y;g.fillStyle='#b773a7';g.fillRect(x-8,y-8,win.w+16,8);g.fillStyle='#a6c6de';g.fillRect(x,y,win.w,win.h);g.fillStyle='#344055';g.fillRect(x+win.w/2-2,y,4,win.h);let pw=(win.w/2)*(1-opening);g.fillStyle='#673d5c';g.fillRect(x,y,pw,win.h);g.fillRect(x+win.w-pw,y,pw,win.h);g.strokeStyle='#e8bbdf';g.lineWidth=5;g.strokeRect(x,y,win.w,win.h);
// furniture: desk, lamp, bookshelf, bed, rug, plant
 g.fillStyle='#493049';g.fillRect(46,145,150,108);g.fillStyle='#a2719c';g.fillRect(40,139,162,10);for(let i=0;i<5;i++){g.fillStyle=['#d88aae','#a784bd','#c79668','#ba719e','#8771a9'][i];g.fillRect(55+i*25,157+(i%2)*5,16,34)}
 g.fillStyle='#57374f';g.fillRect(680,137,167,20);g.fillRect(698,157,12,72);g.fillRect(815,157,12,72);g.fillStyle='#866181';g.fillRect(673,130,181,10);g.fillStyle='#f5cf9b';g.beginPath();g.arc(772,120,15,Math.PI,0);g.lineTo(790,131);g.lineTo(755,131);g.fill();g.fillStyle='#6b4564';g.fillRect(742,129,60,4);
 g.fillStyle='#38243d';g.fillRect(680,400,180,155);g.fillStyle='#94638a';g.fillRect(674,393,192,18);g.fillStyle='#a384a6';g.fillRect(689,416,69,37);g.fillStyle='#634260';g.fillRect(765,412,84,132);
 g.fillStyle='rgba(178,117,166,.13)';g.beginPath();g.ellipse(450,390,225,140,0,0,Math.PI*2);g.fill();g.fillStyle='#382541';g.fillRect(270,465,90,74);g.fillStyle='#75517a';g.fillRect(263,459,104,10);g.fillStyle='#55405d';g.fillRect(34,382,133,98);g.fillStyle='#8d6189';g.fillRect(28,374,145,11);g.fillStyle='#42604d';g.beginPath();g.arc(610,335,24,0,Math.PI*2);g.fill();g.fillRect(602,343,17,38);
}
function drawPlayer(){g.save();g.imageSmoothingEnabled=false;g.fillStyle='rgba(4,3,8,.48)';g.beginPath();g.ellipse(player.x,player.y+18,20,8,0,0,Math.PI*2);g.fill();if(playerSprite.complete&&playerSprite.naturalWidth){const w=58,h=119;g.drawImage(playerSprite,player.x-w/2,player.y-h*.58,w,h)}else{g.fillStyle='#d66eaf';g.beginPath();g.arc(player.x,player.y,18,0,Math.PI*2);g.fill()}g.restore()}
function drawBug(m,near,now){g.save();g.translate(m.x+Math.sin(m.phase)*2,m.y+Math.cos(m.phase*1.3)*2);g.rotate(Math.atan2(m.vy,m.vx)-Math.PI/4);g.globalAlpha=.28+near*.72;g.imageSmoothingEnabled=false;const frame=mosquitoFrames[Math.floor(now/95+m.phase*2)%2];if(frame.complete&&frame.naturalWidth){g.drawImage(frame,-34,-32,68,64)}else{g.fillStyle='#17141b';g.beginPath();g.ellipse(4,2,17,7,0,0,Math.PI*2);g.fill();g.fillStyle='#edcf8d';g.beginPath();g.arc(-13,0,7,0,Math.PI*2);g.fill()}g.restore()}
function hud(now){panel(22,18,260,91);txt(`LEVEL ${level}`,75,41,18,'#ffc8e8');g.fillStyle='#60394f';g.beginPath();g.roundRect(125,34,140,13,6);g.fill();g.fillStyle='#f09acb';g.beginPath();g.roundRect(125,34,140*opening,13,6);g.fill();if(level>=2){txt('☾',51,78,19);g.fillStyle='#574056';g.fillRect(76,73,84,9);g.fillStyle='#b9a5ed';g.fillRect(76,73,84*sleep/sleepGoal,9)}if(level>=3){txt('✎',184,78,18);g.fillStyle='#574056';g.fillRect(205,73,62,9);g.fillStyle='#8fe0c8';g.fillRect(205,73,62*study/studyGoal,9)}panel(22,H-78,294,57);for(let i=0;i<3;i++){txt(i<3-lives?'♡':'♥',54+i*38,H-50,30,i<3-lives?'#755b72':'#ff77ad')}for(let i=0;i<3;i++)txt(i<escaped?'🦟':'♧',184+i*39,H-49,25,i<escaped?'#e9f9e6':'#88748a');
const p=((now-beatStart)%beat+beat)%beat/beat,lx=555,ty=66;panel(545,18,332,91);g.fillStyle='#302635';g.beginPath();g.roundRect(559,31,304,49,10);g.fill();g.strokeStyle='#f4d8ea';g.lineWidth=3;g.beginPath();g.arc(602,55,20,0,7);g.stroke();let nx=602+Math.max(0,1-p)*210;g.fillStyle='#ed5c73';g.beginPath();g.arc(nx,55,14,0,7);g.fill();for(let i=0;i<8;i++){g.fillStyle=i<Math.min(streak,8)?'#a4ffe5':'#745c73';g.beginPath();g.arc(570+i*15,91,3,0,7);g.fill()}txt('↑  ←  ↓  → 이동     SPACE 흥얼',710,590,14,'#d9c3d8','600')}
function titleScreen(now){room();g.fillStyle='rgba(8,5,14,.54)';g.fillRect(0,0,W,H);panel(170,150,560,315);txt('흥얼흥얼,',450,222,45,'#ffd7ef');txt('창밖으로',450,274,52,'#ff91c8');txt('♪',354,206,30,'#fff0a8');txt('♫',551,292,28,'#fff0a8');g.fillStyle='#e99acb';g.beginPath();g.roundRect(322,350,256,58,24);g.fill();g.strokeStyle='#fff0fa';g.lineWidth=3;g.stroke();txt('게임 시작',450,379,23,'#713b68');txt('방향키로 움직이고 SPACE로 박자를 맞춰요',450,452,17,'#e3c9df','500');}
function overlay(now){g.fillStyle='rgba(8,5,13,.75)';g.fillRect(0,0,W,H);panel(205,135,490,350);if(ended&&success){txt(level<3?'모두 창밖으로!':'밤을 무사히 보냈어요',450,213,31,'#ffe4f4');txt('✦   🦟   ✧   🦟   ✧   🦟   ✦',450,285,28,'#fff1bf');txt('♡',450,330,44,'#ff9dce');button(level<3?'다음 레벨 플레이':'처음부터 플레이',340,438,level<3?'next':'restart');button('다시 플레이',560,438,'replay')}else if(ended){txt('모기에게 물렸어요',450,235,31,'#ffd9ee');txt('하트를 모두 잃었어요',450,300,20,'#d6bdd5');button('다시 시작',450,412,'restart')}else{txt(`LEVEL ${level}`,450,240,38,'#ffd6f0');let desc=level===1?'박자를 맞춰 창문을 열고 모기를 유인해요':level===2?'수면시간도 챙기면서 창문을 열고 모기를 내보내요':'수면시간과 공부시간도 챙기면서 모기를 내보내요';txt(desc,450,310,19,'#e7d1e4','500');txt('방향키 이동 · 스페이스 박자',450,357,16,'#bca5bb','500')}}
function button(label,x,y,id){const w=id==='restart'&&label==='다시 시작'?200:178,h=36;g.fillStyle='#db8dc1';g.beginPath();g.roundRect(x-w/2,y-h/2,w,h,15);g.fill();g.strokeStyle='#ffedf8';g.lineWidth=2;g.stroke();txt(label,x,y,14,'#60345b')}
function render(now){room();if(scene==='title'){titleScreen(now);return}if(scene==='intro'){overlay(now);return}for(const n of notes){g.globalAlpha=Math.max(0,1-(now-n.t)/2000);txt('♪',n.x,n.y,20,'#ffe8a6');g.globalAlpha=1}let light=g.createRadialGradient(player.x,player.y,4,player.x,player.y,170);light.addColorStop(0,'rgba(255,211,240,.34)');light.addColorStop(1,'rgba(255,180,225,0)');g.fillStyle=light;g.beginPath();g.arc(player.x,player.y,170,0,7);g.fill();for(const m of bugs)if(m.alive){let d=Math.hypot(m.x-player.x,m.y-player.y);if(d<190)drawBug(m,1-d/190,now)}drawPlayer();hud(now);if(ended)overlay(now)}
function click(e){let r=c.getBoundingClientRect(),x=(e.clientX-r.left)*W/r.width,y=(e.clientY-r.top)*H/r.height;if(scene==='title'){start();return}if(scene==='game'&&ended){if(success&&y>=418&&y<=458&&x>=250&&x<=430){if(level<3){level++;scene='intro';introUntil=performance.now()+1250}else{level=1;scene='intro';introUntil=performance.now()+1250}return}if(success&&y>=418&&y<=458&&x>=470&&x<=650){initGame();return}if(!success&&x>=350&&x<=550&&y>=390&&y<=434){initGame();return}}}
c.addEventListener('pointerdown',click);window.addEventListener('keydown',e=>{if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();if(e.repeat)return;if(scene==='title'){ensureBuzz();start();return}if(scene==='intro'){return}if(scene==='game'&&!ended)ensureBuzz();if(scene==='game'&&e.code==='Space'&&!ended)hum();if(scene==='game'&&ended&&(e.key==='Enter'||e.code==='Space')){if(success&&level<3){level++;scene='intro';introUntil=performance.now()+1250}else{if(success)level=1;initGame()}return}keys[e.key]=true});window.addEventListener('keyup',e=>keys[e.key]=false);requestAnimationFrame(update);
})();
</script></body></html>
