<script>

const canvas=document.querySelector('#game'),ctx=canvas.getContext('2d');

// 이미지 파일 baeksoobucheo.png와 mosquito-buzz.mp3를 HTML 파일과 같은 폴더에 둡니다.
let player,mosquitos,notes,boosts,keys={},escaped,bitten,open,sleepTime,hitStreak,hitStamp,missStamp,ended,success,started,beatStart,last,lastTick=-1,audio=null,biteStamp=-Infinity,buzzMedia=null;
function newMosquito(x,y){const a=Math.random()*Math.PI*2,s=88+Math.random()*18;return{x,y,vx:Math.cos(a),vy:Math.sin(a),baseSpeed:s,currentSpeed:s,turn:.7+Math.random()*2.6,phase:Math.random()*6,alive:true}}
function reset(){player={x:W*.5,y:H*.72};mosquitos=[newMosquito(W*.16,H*.31),newMosquito(W*.78,H*.43),newMosquito(W*.34,H*.55)];notes=[];boosts=[];escaped=0;bitten=0;open=0;sleepTime=0;hitStreak=0;hitStamp=-Infinity;missStamp=-Infinity;ended=false;success=false;started=performance.now();beatStart=started+1000;last=started;lastTick=-1;biteStamp=-Infinity;keys={}}
function getAudio(){if(!audio)audio=new(window.AudioContext||window.webkitAudioContext)();if(!buzzMedia){buzzMedia=new Audio('./mosquito-buzz.mp3');buzzMedia.loop=true;buzzMedia.preload='auto';const playPromise=buzzMedia.play();if(playPromise)playPromise.catch(()=>{})}if(audio.state==='suspended')audio.resume();return audio}
function updateBuzz(){if(!buzzMedia)return;let distance=Infinity;for(const m of mosquitos){if(!m.alive)continue;distance=Math.min(distance,Math.hypot(m.x-player.x,m.y-player.y))}const proximity=Math.max(0,1-distance/340),target=ended?0:.72*proximity*proximity;buzzMedia.volume=Math.max(0,Math.min(1,buzzMedia.volume+(target-buzzMedia.volume)*.12))}
function soundBite(){try{if('speechSynthesis'in window&&window.SpeechSynthesisUtterance){const voices=window.speechSynthesis.getVoices(),korean=voices.find(v=>v.lang&&v.lang.toLowerCase().startsWith('ko'));if(korean){window.speechSynthesis.cancel();const voice=new SpeechSynthesisUtterance('아야!');voice.voice=korean;voice.lang='ko-KR';voice.rate=1.22;voice.pitch=1.5;voice.volume=.72;window.speechSynthesis.speak(voice);return}}const a=getAudio(),t=a.currentTime,o=a.createOscillator(),f1=a.createBiquadFilter(),f2=a.createBiquadFilter(),mix=a.createGain(),env=a.createGain(),g1=a.createGain(),g2=a.createGain();o.type='sawtooth';o.frequency.setValueAtTime(300,t);o.frequency.linearRampToValueAtTime(470,t+.075);o.frequency.setValueAtTime(350,t+.12);o.frequency.linearRampToValueAtTime(540,t+.2);o.frequency.exponentialRampToValueAtTime(340,t+.3);f1.type='bandpass';f1.frequency.value=900;f1.Q.value=1.4;f2.type='bandpass';f2.frequency.value=1650;f2.Q.value=1.8;g1.gain.value=.8;g2.gain.value=.3;env.gain.setValueAtTime(.0001,t);env.gain.exponentialRampToValueAtTime(.055,t+.012);env.gain.setValueAtTime(.025,t+.075);env.gain.setValueAtTime(.0001,t+.095);env.gain.setValueAtTime(.0001,t+.115);env.gain.exponentialRampToValueAtTime(.05,t+.13);env.gain.setValueAtTime(.028,t+.2);env.gain.exponentialRampToValueAtTime(.0001,t+.31);o.connect(f1).connect(g1).connect(mix);o.connect(f2).connect(g2).connect(mix);mix.connect(env).connect(a.destination);o.start(t);o.stop(t+.32)}catch(_){}}
function soundHum(good){try{const a=getAudio(),o=a.createOscillator(),g=a.createGain();o.type='sine';o.frequency.value=good?330:220;g.gain.setValueAtTime(.0001,a.currentTime);g.gain.exponentialRampToValueAtTime(good ? .035 : .018,a.currentTime+.04);g.gain.exponentialRampToValueAtTime(.0001,a.currentTime+.22);o.connect(g).connect(a.destination);o.start();o.stop(a.currentTime+.23)}catch(_){}}
function playBeatTick(index){if(!audio)return;try{const o=audio.createOscillator(),g=audio.createGain(),accent=index%4===0;o.type='triangle';o.frequency.value=accent?168:118;g.gain.setValueAtTime(.0001,audio.currentTime);g.gain.exponentialRampToValueAtTime(accent?0.035:0.022,audio.currentTime+.008);g.gain.exponentialRampToValueAtTime(.0001,audio.currentTime+.11);o.connect(g).connect(audio.destination);o.start();o.stop(audio.currentTime+.12)}catch(_){}}
function hitBeat(now){if(ended)return false;const phase=((now-beatStart)%BEAT+BEAT)%BEAT,delta=Math.min(phase,BEAT-phase);if(delta<=BEAT_WINDOW){open=Math.min(1,open+1/NEEDED);boosts.push(now+2500);hitStreak++;hitStamp=now;notes.push({x:player.x,y:player.y,born:now});return true}else{hitStreak=0;missStamp=now;return false}}
function update(now){const dt=Math.min(.04,(now-last)/1000);last=now;if(audio&&now>=beatStart){const tick=Math.floor((now-beatStart)/BEAT);if(tick>lastTick){lastTick=tick;playBeatTick(tick)}}if(!ended){const dx=(keys.ArrowRight?1:0)-(keys.ArrowLeft?1:0),dy=(keys.ArrowDown?1:0)-(keys.ArrowUp?1:0),length=Math.hypot(dx,dy)||1;player.x=Math.max(55,Math.min(W-55,player.x+dx/length*190*dt));player.y=Math.max(140,Math.min(H-65,player.y+dy/length*190*dt));notes=notes.filter(n=>now-n.born<2000);boosts=boosts.filter(expiry=>expiry>now);
